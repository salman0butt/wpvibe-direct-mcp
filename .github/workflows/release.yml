name: Release

on:
  workflow_run:
    workflows: ["PHP parity checks"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Resolve and verify release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/.*define( 'WPVDMCP_VERSION', '\([^']*\)' ).*/\1/p" wpvibe-direct-mcp.php | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "Could not resolve WPVDMCP_VERSION" >&2
            exit 1
          fi
          HEADER_VERSION="$(sed -n 's/^ \* Version:[[:space:]]*//p' wpvibe-direct-mcp.php | head -n1)"
          STABLE_TAG="$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | head -n1)"
          if [ "$HEADER_VERSION" != "$VERSION" ] || [ "$STABLE_TAG" != "$VERSION" ]; then
            echo "Version metadata mismatch: constant=$VERSION header=$HEADER_VERSION stable=$STABLE_TAG" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "ARCHIVE=wpvibe-direct-mcp-$VERSION.zip" >> "$GITHUB_ENV"

          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            EXISTING_SHA="$(git rev-list -n1 "v$VERSION")"
            if [ "$EXISTING_SHA" != "$TARGET_SHA" ]; then
              echo "Version $VERSION is already released at $EXISTING_SHA; current main $TARGET_SHA is not a new release."
              echo "release_needed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "release_needed=true" >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        if: steps.meta.outputs.release_needed == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: PHP syntax validation
        if: steps.meta.outputs.release_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)

      - name: Run all test suites
        if: steps.meta.outputs.release_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          php tests/run.php
          php tests/parity-run.php
          php tests/reference-run.php

      - name: Build release archive
        if: steps.meta.outputs.release_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist extracted
          mkdir -p build/wpvibe-direct-mcp dist
          rsync -a ./ build/wpvibe-direct-mcp/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'build/' \
            --exclude 'dist/' \
            --exclude 'extracted/'
          (cd build && zip -qr "../dist/$ARCHIVE" wpvibe-direct-mcp)
          unzip -t "dist/$ARCHIVE"
          sha256sum "dist/$ARCHIVE" | tee "dist/$ARCHIVE.sha256"

      - name: Verify extracted archive
        if: steps.meta.outputs.release_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q "dist/$ARCHIVE" -d extracted
          cd extracted/wpvibe-direct-mcp
          php tests/run.php
          php tests/parity-run.php
          php tests/reference-run.php
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null
          done < <(find . -type f -name '*.php' -print0)

      - name: Verify or create immutable tag
        if: steps.meta.outputs.release_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            EXISTING_SHA="$(git rev-list -n1 "$TAG")"
            if [ "$EXISTING_SHA" != "$TARGET_SHA" ]; then
              echo "Tag $TAG already points to $EXISTING_SHA, expected $TARGET_SHA" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$TARGET_SHA" -m "WPVibe Direct MCP $VERSION"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish GitHub Release
        if: steps.meta.outputs.release_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## WPVibe Direct MCP $VERSION"
            echo
            awk -v version="$VERSION" '
              $0 == "## " version " - 2026-10-10" { printing=1; next }
              printing && /^## / { exit }
              printing { print }
            ' CHANGELOG.md
            echo
            echo "Verification: legacy, parity, and reference suites pass; the release ZIP is re-tested after extraction; all PHP files are syntax checked before publication."
          } > release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$ARCHIVE" "dist/$ARCHIVE.sha256" --clobber
          else
            gh release create "$TAG" \
              "dist/$ARCHIVE" \
              "dist/$ARCHIVE.sha256" \
              --target "$TARGET_SHA" \
              --title "WPVibe Direct MCP $VERSION" \
              --notes-file release-notes.md
          fi
