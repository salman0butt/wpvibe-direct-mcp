name: Release 1.3.0

on:
  workflow_run:
    workflows: ["PHP parity checks"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      VERSION: 1.3.0
      TAG: v1.3.0
      ARCHIVE: wpvibe-direct-mcp-1.3.0.zip
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Verify version metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^ \* Version:[[:space:]]+1\.3\.0$' wpvibe-direct-mcp.php
          grep -Eq "define\([[:space:]]*'WPVDMCP_VERSION',[[:space:]]*'1\.3\.0'[[:space:]]*\)" wpvibe-direct-mcp.php
          grep -Eq '^Stable tag:[[:space:]]+1\.3\.0$' readme.txt

      - name: PHP syntax validation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)

      - name: Run all test suites
        shell: bash
        run: |
          set -euo pipefail
          php tests/run.php
          php tests/parity-run.php
          php tests/reference-run.php

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist extracted
          mkdir -p build/wpvibe-direct-mcp dist
          rsync -a ./ build/wpvibe-direct-mcp/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'build/' \
            --exclude 'dist/' \
            --exclude 'extracted/'
          (cd build && zip -qr "../dist/$ARCHIVE" wpvibe-direct-mcp)
          unzip -t "dist/$ARCHIVE"
          sha256sum "dist/$ARCHIVE" | tee "dist/$ARCHIVE.sha256"

      - name: Verify extracted archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q "dist/$ARCHIVE" -d extracted
          cd extracted/wpvibe-direct-mcp
          php tests/run.php
          php tests/parity-run.php
          php tests/reference-run.php
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null
          done < <(find . -type f -name '*.php' -print0)

      - name: Verify or create immutable tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            EXISTING_SHA="$(git rev-list -n1 "$TAG")"
            if [ "$EXISTING_SHA" != "$TARGET_SHA" ]; then
              echo "Tag $TAG already points to $EXISTING_SHA, expected $TARGET_SHA" >&2
              exit 1
            fi
          else
            git tag -a "$TAG" "$TARGET_SHA" -m "WPVibe Direct MCP $VERSION"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          ## WPVibe Direct MCP 1.3.0

          - Completes the audited WPVibe 1.20.3 public/reference tool surface for Direct MCP.
          - Adds exact public aliases plus fail-closed provider-backed hosted account/fleet/usage tools.
          - Adds MCP Apps approval/upload resources, screenshot/browser provider support, SeedProd compile flow, richer saved skills, and the machine-readable parity manifest.
          - Expands current Works-with-AI/plugin playbooks and reference regression coverage.
          - Keeps hosted/private WPVibe services explicit rather than fabricating cloud state locally.

          Verification: legacy, parity, and reference suites pass; release ZIP is re-tested after extraction; all PHP files are syntax checked before publication.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$ARCHIVE" "dist/$ARCHIVE.sha256" --clobber
          else
            gh release create "$TAG" \
              "dist/$ARCHIVE" \
              "dist/$ARCHIVE.sha256" \
              --target "$TARGET_SHA" \
              --title "WPVibe Direct MCP $VERSION" \
              --notes-file release-notes.md
          fi
