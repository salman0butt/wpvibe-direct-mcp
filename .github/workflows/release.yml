name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version to release, for example 1.4.0'
        required: true
        type: string
      target_sha:
        description: 'Exact 40-character commit SHA that already passed parity CI'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      TARGET_SHA: ${{ inputs.target_sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid version: $VERSION" >&2; exit 1; }
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "target_sha must be an exact lowercase 40-character commit SHA" >&2; exit 1; }
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "ARCHIVE=wpvibe-direct-mcp-$VERSION.zip" >> "$GITHUB_ENV"

      - name: Checkout exact verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify target belongs to main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=500
          git merge-base --is-ancestor "$TARGET_SHA" origin/main || {
            echo "Refusing to release $TARGET_SHA because it is not in main history." >&2
            exit 1
          }

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Verify version metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION_RE="${VERSION//./\\.}"
          grep -Eq "^ \* Version:[[:space:]]+$VERSION_RE$" wpvibe-direct-mcp.php
          grep -Eq "define\([[:space:]]*'WPVDMCP_VERSION',[[:space:]]*'$VERSION_RE'[[:space:]]*\)" wpvibe-direct-mcp.php
          grep -Eq "^Stable tag:[[:space:]]+$VERSION_RE$" readme.txt

      - name: Require successful parity CI for target
        shell: bash
        run: |
          set -euo pipefail
          RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/php-parity.yml/runs?head_sha=$TARGET_SHA&status=completed&per_page=20")"
          python3 - "$TARGET_SHA" <<'PY' <<<"$RUNS"
          import json, sys
          target = sys.argv[1]
          data = json.load(sys.stdin)
          good = [r for r in data.get('workflow_runs', []) if r.get('head_sha') == target and r.get('conclusion') == 'success']
          if not good:
              raise SystemExit(f'No successful PHP parity checks run found for exact target {target}')
          print('Verified CI run:', good[0].get('html_url'))
          PY

      - name: PHP syntax validation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)

      - name: Run all test suites
        shell: bash
        run: |
          set -euo pipefail
          php tests/run.php
          php tests/parity-run.php
          php tests/reference-run.php

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist extracted
          mkdir -p build/wpvibe-direct-mcp dist
          rsync -a ./ build/wpvibe-direct-mcp/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'build/' \
            --exclude 'dist/' \
            --exclude 'extracted/'
          (cd build && zip -qr "../dist/$ARCHIVE" wpvibe-direct-mcp)
          unzip -t "dist/$ARCHIVE"
          sha256sum "dist/$ARCHIVE" | tee "dist/$ARCHIVE.sha256"

      - name: Verify extracted archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q "dist/$ARCHIVE" -d extracted
          cd extracted/wpvibe-direct-mcp
          php tests/run.php
          php tests/parity-run.php
          php tests/reference-run.php
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null
          done < <(find . -type f -name '*.php' -print0)

      - name: Verify or create immutable tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            EXISTING_SHA="$(git rev-list -n1 "$TAG")"
            if [ "$EXISTING_SHA" != "$TARGET_SHA" ]; then
              echo "Tag $TAG already points to $EXISTING_SHA, expected $TARGET_SHA" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$TARGET_SHA" -m "WPVibe Direct MCP $VERSION"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          ## WPVibe Direct MCP $VERSION

          Release built from exact commit \`$TARGET_SHA\` after successful PHP parity CI.

          Verification: PHP syntax validation, legacy tests, parity tests, reference/runtime parity tests, release ZIP integrity, and extracted-ZIP re-tests all pass before publication.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$ARCHIVE" "dist/$ARCHIVE.sha256" --clobber
          else
            gh release create "$TAG" \
              "dist/$ARCHIVE" \
              "dist/$ARCHIVE.sha256" \
              --target "$TARGET_SHA" \
              --title "WPVibe Direct MCP $VERSION" \
              --notes-file release-notes.md
          fi
