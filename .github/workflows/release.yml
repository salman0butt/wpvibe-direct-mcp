name: Release

on:
  workflow_run:
    workflows: ["PHP parity checks", "WordPress Elementor E2E"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify exact current-main CI gates
        id: gates
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin main
          CURRENT_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [ "$TARGET_SHA" != "$CURRENT_MAIN_SHA" ]; then
            echo "Release target $TARGET_SHA is stale; current origin/main is $CURRENT_MAIN_SHA."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RUNS_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100")"
          latest_gate() {
            local workflow_name="$1"
            jq -r --arg workflow_name "$workflow_name" '
              [.workflow_runs[] | select(.name == $workflow_name)]
              | sort_by(.run_number)
              | last
              | if . == null then "missing" else (.status + ":" + (.conclusion // "")) end
            ' <<<"$RUNS_JSON"
          }

          PHP_GATE="$(latest_gate 'PHP parity checks')"
          E2E_GATE="$(latest_gate 'WordPress Elementor E2E')"
          echo "PHP parity gate: $PHP_GATE"
          echo "WordPress Elementor E2E gate: $E2E_GATE"

          if [ "$PHP_GATE" != "completed:success" ]; then
            echo "Required exact-SHA PHP parity gate is not green; release remains closed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$E2E_GATE" != "completed:success" ]; then
            echo "Required exact-SHA WordPress Elementor E2E gate is not green; release remains closed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Resolve and verify release metadata
        id: meta
        if: steps.gates.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/.*define( 'WPVDMCP_VERSION', '\([^']*\)' ).*/\1/p" wpvibe-direct-mcp.php | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "Could not resolve WPVDMCP_VERSION" >&2
            exit 1
          fi
          HEADER_VERSION="$(sed -n 's/^ \* Version:[[:space:]]*//p' wpvibe-direct-mcp.php | head -n1)"
          STABLE_TAG="$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | head -n1)"
          if [ "$HEADER_VERSION" != "$VERSION" ] || [ "$STABLE_TAG" != "$VERSION" ]; then
            echo "Version metadata mismatch: constant=$VERSION header=$HEADER_VERSION stable=$STABLE_TAG" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "ARCHIVE=wpvibe-direct-mcp-$VERSION.zip" >> "$GITHUB_ENV"

          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            EXISTING_SHA="$(git rev-list -n1 "v$VERSION")"
            if [ "$EXISTING_SHA" != "$TARGET_SHA" ]; then
              echo "Version $VERSION is already released at $EXISTING_SHA; current main $TARGET_SHA is not a new release."
              echo "release_needed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "release_needed=true" >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        if: steps.meta.outputs.release_needed == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: PHP syntax validation
        if: steps.meta.outputs.release_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)

      - name: Run all test suites
        if: steps.meta.outputs.release_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          php tests/run.php
          php tests/parity-run.php
          php tests/reference-run.php
          php tests/abilities-json-body-run.php

      - name: Build release archive
        if: steps.meta.outputs.release_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist extracted
          mkdir -p build/wpvibe-direct-mcp dist
          rsync -a ./ build/wpvibe-direct-mcp/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'build/' \
            --exclude 'dist/' \
            --exclude 'extracted/'
          (cd build && zip -qr "../dist/$ARCHIVE" wpvibe-direct-mcp)
          unzip -t "dist/$ARCHIVE"
          sha256sum "dist/$ARCHIVE" | tee "dist/$ARCHIVE.sha256"

      - name: Verify extracted archive
        if: steps.meta.outputs.release_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q "dist/$ARCHIVE" -d extracted
          cd extracted/wpvibe-direct-mcp
          php tests/run.php
          php tests/parity-run.php
          php tests/reference-run.php
          php tests/abilities-json-body-run.php
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null
          done < <(find . -type f -name '*.php' -print0)

      - name: Verify or create immutable tag
        if: steps.meta.outputs.release_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin main
          CURRENT_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [ "$TARGET_SHA" != "$CURRENT_MAIN_SHA" ]; then
            echo "Release target $TARGET_SHA became stale while building; current origin/main is $CURRENT_MAIN_SHA." >&2
            exit 1
          fi

          RUNS_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100")"
          latest_gate() {
            local workflow_name="$1"
            jq -r --arg workflow_name "$workflow_name" '
              [.workflow_runs[] | select(.name == $workflow_name)]
              | sort_by(.run_number)
              | last
              | if . == null then "missing" else (.status + ":" + (.conclusion // "")) end
            ' <<<"$RUNS_JSON"
          }

          PHP_GATE="$(latest_gate 'PHP parity checks')"
          E2E_GATE="$(latest_gate 'WordPress Elementor E2E')"
          if [ "$PHP_GATE" != "completed:success" ]; then
            echo "Exact-SHA PHP parity gate changed before tag: $PHP_GATE" >&2
            exit 1
          fi
          if [ "$E2E_GATE" != "completed:success" ]; then
            echo "Exact-SHA WordPress Elementor E2E gate changed before tag: $E2E_GATE" >&2
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            EXISTING_SHA="$(git rev-list -n1 "$TAG")"
            if [ "$EXISTING_SHA" != "$TARGET_SHA" ]; then
              echo "Tag $TAG already points to $EXISTING_SHA, expected $TARGET_SHA" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$TARGET_SHA" -m "WPVibe Direct MCP $VERSION"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish GitHub Release
        if: steps.meta.outputs.release_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## WPVibe Direct MCP $VERSION"
            echo
            awk -v version="$VERSION" '
              index($0, "## " version " ") == 1 { printing=1; next }
              printing && /^## / { exit }
              printing { print }
            ' CHANGELOG.md
            echo
            echo "Verification: legacy, parity, reference, and focused Abilities request-body regression suites pass on the source checkout and extracted release ZIP; all PHP files are syntax checked before publication."
          } > release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$ARCHIVE" "dist/$ARCHIVE.sha256" --clobber
          else
            gh release create "$TAG" \
              "dist/$ARCHIVE" \
              "dist/$ARCHIVE.sha256" \
              --target "$TARGET_SHA" \
              --title "WPVibe Direct MCP $VERSION" \
              --notes-file release-notes.md
          fi
