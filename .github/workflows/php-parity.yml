name: PHP parity checks
on:
  push:
    branches: [main, 'feat/**', 'publish/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax validation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)
      - name: Legacy tests
        run: php tests/run.php
      - name: Parity tests
        run: php tests/parity-run.php
      - name: Reference tests
        run: php tests/reference-run.php
